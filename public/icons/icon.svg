<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8172F2" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <g transform="translate(256, 256) scale(1.6)" filter="url(#glow)">
    <!-- RealMoney Diamond Monogram -->
    <path d="M 0 -70 L 60 0 L 0 70 L -60 0 Z" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" />
    <path d="M 0 -35 L 30 0 L 0 35 L -30 0 Z" fill="#FFFFFF" />
  </g>
</svg>
